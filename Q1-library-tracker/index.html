<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Book Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <span class="navbar-brand">Library Book Tracker</span>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row">

      <!-- Add Book form -->
      <div class="col-md-4">
        <h4>Add Book</h4>
        <form id="bookForm">
          <input type="text" id="title" class="form-control mb-2" placeholder="Title">
          <input type="text" id="author" class="form-control mb-2" placeholder="Author">
          <select id="category" class="form-select mb-2">
            <option value="">Select Category</option>
            <option>Fiction</option>
            <option>Programming</option>
            <option>History</option>
          </select>
          <input type="number" id="year" class="form-control mb-2" placeholder="Year">
          <button type="submit" class="btn btn-primary w-100">Add Book</button>
        </form>
      </div>

      <!-- Book list -->
      <div class="col-md-8">
        <h4>Books</h4>
        <select id="filter" class="form-select mb-3">
          <option value="All">All</option>
          <option>Fiction</option>
          <option>Programming</option>
          <option>History</option>
        </select>

        <table class="table table-bordered">
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Category</th>
              <th>Year</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="bookTable"></tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
