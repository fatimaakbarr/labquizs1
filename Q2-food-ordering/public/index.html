<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-danger">
    <div class="container">
      <span class="navbar-brand">Online Food Ordering</span>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row">

      <!-- Add Menu Item form -->
      <div class="col-md-4">
        <h4>Add Menu Item</h4>
        <form id="menuForm">
          <input type="text" id="name" class="form-control mb-2" placeholder="Item name">
          <input type="number" id="price" class="form-control mb-2" placeholder="Price">
          <select id="restaurant" class="form-select mb-2">
            <option value="">Select Restaurant</option>
          </select>
          <button type="submit" class="btn btn-danger w-100">Add Item</button>
        </form>
      </div>

      <!-- Menu items list -->
      <div class="col-md-8">
        <h4>Menu Items</h4>
        <table class="table table-bordered">
          <thead>
            <tr>
              <th>Name</th>
              <th>Price</th>
              <th>Restaurant</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="menuTable"></tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
